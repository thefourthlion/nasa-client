# nasa-client: web UI. nasa-api: NASA archive and proxy. nasa-mongo: database.
# Copy .env.example to .env, then: docker compose up --build

name: nasa

services:
  nasa-mongo:
    image: mongo:7.0
    container_name: nasa-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - nasa-mongo-data:/data/db
    networks:
      - nasa-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nasa-api:
    build: ./server
    image: nasa-api
    container_name: nasa-api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "4017:3002"
    env_file:
      - .env
    environment:
      PORT: "3002"
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@nasa-mongo:27017/nasa?authSource=admin
    depends_on:
      nasa-mongo:
        condition: service_healthy
    networks:
      - nasa-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nasa-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4017}
    image: nasa-client
    container_name: nasa-client
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "4016:4016"
    environment:
      PORT: "4016"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    depends_on:
      nasa-api:
        condition: service_healthy
    networks:
      - nasa-net

networks:
  nasa-net:
    name: nasa-net

volumes:
  nasa-mongo-data:
    name: nasa-mongo-data
