# API and database. From this directory:
#   docker compose --env-file ../.env up --build
# The web UI is nasa-client, published on 4016 from the repo root compose.

services:
  nasa-api:
    build: .
    image: nasa-api
    container_name: nasa-api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "4017:3002"
    env_file:
      - ../.env
    environment:
      PORT: "3002"
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@nasa-mongo:27017/nasa?authSource=admin
    depends_on:
      nasa-mongo:
        condition: service_healthy
    networks:
      - nasa-net

  nasa-mongo:
    image: mongo:7.0
    container_name: nasa-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - nasa-mongo-data:/data/db
    networks:
      - nasa-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  nasa-net:
    name: nasa-net

volumes:
  nasa-mongo-data:
    name: nasa-mongo-data
